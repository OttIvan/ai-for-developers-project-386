name: Link booking decision map

on:
  push:
    branches: [chore/booking-map-links]
    paths: ['.github/workflows/link-booking-map.yml']

permissions:
  contents: read
  issues: write

jobs:
  link:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Label decisions and verify native issue links
        run: |
          test "$GH_REPO" = 'OttIvan/ai-for-developers-project-386'
          labels="$(gh label list --repo "$GH_REPO" --limit 1000 --json name --jq '.[].name')"
          if ! grep -Fxq 'wayfinder:map' <<< "$labels"; then
            gh label create 'wayfinder:map' --repo "$GH_REPO" --color 5319E7 --description 'Decision map'
          fi
          if ! grep -Fxq 'wayfinder:grilling' <<< "$labels"; then
            gh label create 'wayfinder:grilling' --repo "$GH_REPO" --color 1D76DB --description 'Decision to discuss with the project owner'
          fi
          gh issue edit 1 --repo "$GH_REPO" --add-label 'wayfinder:map'
          subissues="repos/$GH_REPO/issues/1/sub_issues"
          attach() {
            local number="$1" child_id="$2"
            gh issue edit "$number" --repo "$GH_REPO" --add-label 'wayfinder:grilling'
            if ! gh api "$subissues" --paginate --jq '.[].id' | grep -Fx "$child_id" >/dev/null; then
              gh api --method POST "$subissues" -F sub_issue_id="$child_id" --silent
            fi
          }
          block() {
            local number="$1" blocker_id="$2"
            local endpoint="repos/$GH_REPO/issues/$number/dependencies/blocked_by"
            if ! gh api "$endpoint" --paginate --jq '.[].id' | grep -Fx "$blocker_id" >/dev/null; then
              gh api --method POST "$endpoint" -F issue_id="$blocker_id" --silent
            fi
            gh api "$endpoint" --paginate --jq '.[].id' | grep -Fx "$blocker_id"
          }
          attach 3 6611472839
          attach 6 6611476007
          attach 5 6611474882
          attach 2 6611471830
          attach 4 6611473835
          attach 7 6611477090
          block 5 6611472839
          block 2 6611474882
          block 2 6611476007
          block 4 6611471830
          block 7 6611473835
          gh api "$subissues" --paginate --jq '.[] | "\(.number) \(.title)"'
          test "$(gh api "$subissues" --paginate --jq '.[].id' | wc -l)" -eq 6
