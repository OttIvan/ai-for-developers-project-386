name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify Docker build and container
        if: runner.os == 'Linux'
        run: |
          docker build -t call-calendar .
          docker run --rm -d --name call-calendar -p 127.0.0.1:3000:3000 call-calendar
          trap 'docker logs call-calendar; docker stop --time 2 call-calendar' EXIT
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:3000/api/health | grep -F '{"status":"ok"}'
          curl --fail http://127.0.0.1:3000/ | grep -F '<title>Календарь звонков</title>'
