name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - run: npm install
      - name: Record dependency lock
        run: gzip -nc package-lock.json | base64 -w 100 | sed 's/^/LOCK:/'

      - run: npm run check
